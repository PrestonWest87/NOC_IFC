name: noc-ifc-dev-c

x-backend-common: &backend-common
  env_file: .env
  user: "${DEV_C_UID:-1000}:${DEV_C_GID:-1000}"
  volumes:
    - type: bind
      source: ./data-dev-c
      target: /app/data
      bind:
        create_host_path: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

x-backend-environment: &backend-environment
  DATABASE_URL: sqlite:////app/data/noc_fusion.db

services:
  api:
    <<: *backend-common
    network_mode: bridge
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment:
      <<: *backend-environment
      ASPNETCORE_URLS: http://+:8101
      PUBLIC_APP_URL: http://localhost:8501
    ports:
      - "8101:8101"

  worker:
    <<: *backend-common
    network_mode: bridge
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: worker
    environment:
      <<: *backend-environment

  webhook:
    <<: *backend-common
    network_mode: bridge
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
      target: webhook
    environment:
      <<: *backend-environment
    ports:
      - "8100:8100"

  web:
    network_mode: bridge
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8501:5173"
    extra_hosts:
      - "noc-ifc-dev-c-api:host-gateway"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    network_mode: bridge
    image: node:22-alpine
    working_dir: /app
    command: sh ./dev-entrypoint.sh
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://noc-ifc-dev-c-api:8101
    extra_hosts:
      - "noc-ifc-dev-c-api:host-gateway"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./web:/app
      - web_dev_node_modules:/app/node_modules

volumes:
  web_dev_node_modules:
