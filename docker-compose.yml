services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8101
    user: "10001:10001"
    ports:
      - "8101:8101"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u src/scheduler.py
    user: "10001:10001"
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G

  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u src/webhook_listener.py
    user: "10001:10001"
    ports:
      - "8100:8100"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8501:5173"
    environment:
      - VITE_API_URL=http://localhost:8101
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  web-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8101
    depends_on:
      - api
    volumes:
      - ./web:/app
