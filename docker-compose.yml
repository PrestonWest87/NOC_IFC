name: noc-ifc-dev

services:
  # FastAPI owns REST/WebSocket requests and runs migrations/readiness on startup.
  api:
    network_mode: bridge
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8101
    ports:
      - "8102:8101"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/noc_fusion.db
      PUBLIC_APP_URL: http://localhost:8503
      CORS_ORIGINS: http://localhost:8503,http://localhost:5174,http://localhost:5173
    volumes:
      - ./data-dev:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # The scheduler shares the SQLite/model volume and waits for API readiness.
  worker:
    network_mode: bridge
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u src/scheduler.py
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/noc_fusion.db
    restart: unless-stopped
    volumes:
      - ./data-dev:/app/data
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G

  webhook:
    network_mode: bridge
    build:
      context: .
      dockerfile: Dockerfile
    command: python -u src/webhook_listener.py
    ports:
      - "8099:8100"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/noc_fusion.db
    volumes:
      - ./data-dev:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # Static production bundle; Nginx proxies relative /api and /ws requests.
  web:
    network_mode: bridge
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8503:5173"
    environment:
      - VITE_API_URL=http://noc-ifc-dev-api:8102
    extra_hosts:
      - "noc-ifc-dev-api:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Additive dev profile: Vite runs beside the production web service.
  web-dev:
    network_mode: bridge
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh ./dev-entrypoint.sh
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://noc-ifc-dev-api:8102
    extra_hosts:
      - "noc-ifc-dev-api:host-gateway"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - web_dev_node_modules:/app/node_modules

volumes:
  web_dev_node_modules:
